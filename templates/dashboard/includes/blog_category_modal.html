<!-- Create Blog Category Modal -->
<div class="modal fade" id="createCategoryModal" tabindex="-1" aria-labelledby="createCategoryModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:var(--radius-lg, 12px);box-shadow:0 10px 30px rgba(0,0,0,0.5);">
            <div class="modal-header" style="border-bottom:1px solid var(--border-color);padding:1.25rem 1.5rem;">
                <h5 class="modal-title fw-bold" id="createCategoryModalLabel" style="color:var(--text-white);display:flex;align-items:center;gap:0.5rem;">
                    <i class="fas fa-folder-plus" style="color:var(--accent);"></i>
                    Create Blog Category
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="createCategoryForm" method="post" action="{% url 'dashboard:blog_category_create' %}">
                {% csrf_token %}
                <div class="modal-body" style="padding:1.5rem;">
                    <div id="categoryModalError" class="alert alert-danger d-none mb-3" role="alert" style="font-size:0.875rem;"></div>

                    <div class="mb-3">
                        <label for="modalCategoryName" class="form-label" style="font-weight:600;font-size:0.9rem;color:var(--text-white);">
                            Category Name <span style="color:#dc3545;">*</span>
                        </label>
                        <input type="text" name="name" id="modalCategoryName" class="form-control" placeholder="e.g. Artificial Intelligence, Tutorials, Web Dev" required autocomplete="off" style="background:var(--bg-primary);border-color:var(--border-color);color:var(--text-white);">
                        <div class="form-text" style="color:var(--text-dim);font-size:0.8rem;">A unique name for grouping blog posts. Slug will be auto-generated.</div>
                    </div>

                    <div class="mb-3">
                        <label for="modalCategoryDescription" class="form-label" style="font-weight:600;font-size:0.9rem;color:var(--text-white);">
                            Description <span style="color:var(--text-dim);font-weight:normal;">(Optional)</span>
                        </label>
                        <textarea name="description" id="modalCategoryDescription" class="form-control" rows="3" placeholder="Brief summary of articles in this category..." style="background:var(--bg-primary);border-color:var(--border-color);color:var(--text-white);"></textarea>
                    </div>

                    <div class="mb-2">
                        <label for="modalCategoryOrder" class="form-label" style="font-weight:600;font-size:0.9rem;color:var(--text-white);">
                            Display Order
                        </label>
                        <input type="number" name="display_order" id="modalCategoryOrder" class="form-control" value="0" style="background:var(--bg-primary);border-color:var(--border-color);color:var(--text-white);max-width:140px;">
                        <div class="form-text" style="color:var(--text-dim);font-size:0.8rem;">Determines sort priority in category listings (lower numbers appear first).</div>
                    </div>
                </div>
                <div class="modal-footer" style="border-top:1px solid var(--border-color);padding:1rem 1.5rem;">
                    <button type="button" class="btn btn-outline-accent" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" id="modalCategorySubmitBtn" class="btn btn-accent">
                        <span class="spinner-border spinner-border-sm d-none me-1" id="modalCategorySpinner" role="status"></span>
                        <i class="fas fa-save me-1" id="modalCategorySaveIcon"></i>
                        <span id="modalCategorySubmitText">Save Category</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
(function() {
    const modalEl = document.getElementById('createCategoryModal');
    if (!modalEl) return;

    const form = document.getElementById('createCategoryForm');
    const nameInput = document.getElementById('modalCategoryName');
    const descInput = document.getElementById('modalCategoryDescription');
    const orderInput = document.getElementById('modalCategoryOrder');
    const errorBox = document.getElementById('categoryModalError');
    const submitBtn = document.getElementById('modalCategorySubmitBtn');
    const spinner = document.getElementById('modalCategorySpinner');
    const saveIcon = document.getElementById('modalCategorySaveIcon');
    const submitText = document.getElementById('modalCategorySubmitText');

    modalEl.addEventListener('shown.bs.modal', function() {
        if (nameInput) nameInput.focus();
    });

    modalEl.addEventListener('hidden.bs.modal', function() {
        if (form) form.reset();
        if (errorBox) {
            errorBox.classList.add('d-none');
            errorBox.textContent = '';
        }
    });

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        if (errorBox) {
            errorBox.classList.add('d-none');
            errorBox.textContent = '';
        }

        submitBtn.disabled = true;
        spinner.classList.remove('d-none');
        saveIcon.classList.add('d-none');
        submitText.textContent = 'Saving...';

        const formData = new FormData(form);

        fetch(form.action, {
            method: 'POST',
            body: formData,
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
        .then(response => response.json().then(data => ({ status: response.status, data })))
        .then(({ status, data }) => {
            submitBtn.disabled = false;
            spinner.classList.add('d-none');
            saveIcon.classList.remove('d-none');
            submitText.textContent = 'Save Category';

            if (status >= 200 && status < 300 && data.success) {
                // Check if an existing category select exists (e.g. on blog post create/edit page)
                const postCategorySelect = document.getElementById('id_category');
                const filterCategorySelect = document.querySelector('select[name="category"]');

                if (postCategorySelect) {
                    const newOption = new Option(data.name, data.id, true, true);
                    postCategorySelect.add(newOption);
                    postCategorySelect.value = data.id;
                    postCategorySelect.dispatchEvent(new Event('change'));
                }

                if (filterCategorySelect && !postCategorySelect) {
                    const filterOption = new Option(`${data.name} (0)`, data.slug, false, false);
                    filterCategorySelect.add(filterOption);
                }

                // Close modal
                const bsModal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
                bsModal.hide();

                // If on the blog post list page, refresh to show the new category in filters and table
                if (!postCategorySelect) {
                    window.location.reload();
                }
            } else {
                let errorMsg = 'An error occurred while saving the category.';
                if (data && data.errors) {
                    const errorList = [];
                    for (const key in data.errors) {
                        errorList.push(data.errors[key].join(' '));
                    }
                    if (errorList.length > 0) {
                        errorMsg = errorList.join('<br>');
                    }
                } else if (data && data.message) {
                    errorMsg = data.message;
                }
                errorBox.innerHTML = errorMsg;
                errorBox.classList.remove('d-none');
            }
        })
        .catch(err => {
            submitBtn.disabled = false;
            spinner.classList.add('d-none');
            saveIcon.classList.remove('d-none');
            submitText.textContent = 'Save Category';
            errorBox.textContent = 'Connection error. Please try again.';
            errorBox.classList.remove('d-none');
        });
    });
})();
</script>
