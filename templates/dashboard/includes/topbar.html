<header class="topbar">
    <div class="d-flex align-items-center gap-3">
        <button class="sidebar-toggler">
            <i class="fas fa-bars"></i>
        </button>
        <h6 class="mb-0 fw-bold" style="color:var(--text-muted);">{% block topbar_title %}Dashboard{% endblock %}</h6>
    </div>
    <div class="d-flex align-items-center gap-3">
        <a href="{% url 'core:home' %}" class="btn btn-sm btn-outline-accent" target="_blank">
            <i class="fas fa-external-link-alt me-1"></i> View Site
        </a>
        <div class="dropdown">
            <a class="d-flex align-items-center gap-2 text-decoration-none" href="#" data-bs-toggle="dropdown">
                <div style="width:36px;height:36px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;">
                    <span style="color:var(--bg-primary);font-weight:700;">{{ request.user.first_name.0|default:request.user.username.0|upper }}</span>
                </div>
                <span style="color:var(--text-muted);font-size:0.9rem;">{{ request.user.get_short_name|default:request.user.username }}</span>
                <i class="fas fa-chevron-down" style="font-size:0.7rem;color:var(--text-dim);"></i>
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="{% url 'accounts:profile' %}"><i class="fas fa-user me-2"></i>Profile</a></li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <form method="post" action="{% url 'accounts:logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="dropdown-item"><i class="fas fa-sign-out-alt me-2"></i>Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</header>
