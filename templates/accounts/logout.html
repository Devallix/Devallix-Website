{% extends 'base.html' %}
{% block title %}Logged Out - {{ block.super }}{% endblock %}
{% block content %}
<div class="page-header">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 text-center" data-aos="fade-up">
                <h1 class="section-title">You've Been <span class="accent">Logged Out</span></h1>
                <p class="section-subtitle">You have been successfully signed out of your account.</p>
            </div>
        </div>
    </div>
</div>

<section class="section-padding">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <div class="card-custom text-center" data-aos="fade-up">
                    <div style="width:80px;height:80px;border-radius:50%;background:rgba(182,255,0,0.1);display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;">
                        <i class="fas fa-check" style="font-size:2rem;color:var(--accent-primary);"></i>
                    </div>
                    <h4 class="fw-bold mb-3">Signed Out Successfully</h4>
                    <p style="color:var(--text-muted);margin-bottom:2rem;">Thank you for visiting. See you again soon!</p>
                    <div class="d-flex gap-3 justify-content-center">
                        <a href="{% url 'accounts:login' %}" class="btn btn-primary-custom">
                            <i class="fas fa-sign-in-alt"></i> Sign In Again
                        </a>
                        <a href="{% url 'core:home' %}" class="btn btn-outline-custom">
                            <i class="fas fa-home"></i> Go Home
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
